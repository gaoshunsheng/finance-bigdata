# ============================================================================
# Finance Bigdata Platform — CI/CD Pipeline
# ============================================================================
# Triggers: push to main/develop, pull requests to main/develop
# Jobs:
#   1. java-build-test   — Maven build + unit tests for all Java modules
#   2. python-build-test — Python lint + tests for model-platform
#   3. frontend-build    — Node build + type check for decision-ui
#   4. docker-build      — Build & push Docker images (on main push only)
#   5. deploy-staging    — Deploy to staging (on main push only)
#   6. deploy-production — Deploy to production (manual approval)
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/finance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# Job 1: Java Build & Test
# ============================================================================
jobs:
  java-build-test:
    name: Java Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build all modules
        run: mvn compile -B -T 2C

      - name: Run unit tests
        run: mvn test -B -T 2C

      - name: Verify all modules
        run: mvn verify -B -T 2C -DskipTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: "**/target/surefire-reports/"
          retention-days: 7

  # ==========================================================================
  # Job 2: Python Build & Test (model-platform)
  # ==========================================================================
  python-build-test:
    name: Python Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-platform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model-platform/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Run tests
        run: pytest --tb=short -q --cov=app --cov-report=term-missing

  # ==========================================================================
  # Job 3: Frontend Build (decision-ui)
  # ==========================================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: decision-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decision-ui-dist
          path: decision-ui/dist/
          retention-days: 3

  # ==========================================================================
  # Job 4: Docker Build & Push (only on main push or version tags)
  # ==========================================================================
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [java-build-test, python-build-test, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: decision-server
            dockerfile: docs/deployment/Dockerfile.java
            context: .
            build_arg_service: decision-server
          - name: decision-admin
            dockerfile: docs/deployment/Dockerfile.java
            context: .
            build_arg_service: decision-admin
          - name: data-service
            dockerfile: docs/deployment/Dockerfile.java
            context: .
            build_arg_service: data-platform/data-service
          - name: model-platform
            dockerfile: model-platform/Dockerfile
            context: model-platform
            build_arg_service: ""
          - name: decision-ui
            dockerfile: decision-ui/Dockerfile
            context: decision-ui
            build_arg_service: ""
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.service.build_arg_service }}
            MAVEN_PROFILE=prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Job 5: Deploy to Staging (on main push)
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Image tag: sha-${GITHUB_SHA::7}"
          # Replace with actual deployment commands, e.g.:
          # kubectl set image deployment/decision-server \
          #   decision-server=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-decision-server:sha-${GITHUB_SHA::7} \
          #   -n finance-platform
          # kubectl rollout status deployment/decision-server -n finance-platform
          echo "Staging deployment complete"

  # ==========================================================================
  # Job 6: Deploy to Production (manual approval + version tag)
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Version: ${GITHUB_REF_NAME}"
          echo "Image tag: ${GITHUB_REF_NAME}"
          # Replace with actual deployment commands, e.g.:
          # kubectl set image deployment/decision-server \
          #   decision-server=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-decision-server:${GITHUB_REF_NAME} \
          #   -n finance-platform
          # kubectl rollout status deployment/decision-server -n finance-platform --timeout=300s
          echo "Production deployment complete"
