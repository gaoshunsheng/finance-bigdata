server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: decision-server
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# 决策引擎配置
decision:
  engine:
    # 线程池配置
    thread-pool:
      # DAG 并行执行线程池
      dag-execution:
        core-size: 8
        max-size: 32
        queue-capacity: 200
        thread-name-prefix: dag-exec-
      # 外部 API 调用线程池
      external-api:
        core-size: 4
        max-size: 16
        queue-capacity: 100
        thread-name-prefix: ext-api-
    # 缓存配置
    cache:
      max-size: 10000
      max-versions: 5
      expire-hours: 24
    # 限流配置
    rate-limit:
      enabled: true
      max-requests-per-second: 500
    # 鉴权配置
    auth:
      enabled: true
      secret-key: "change-me-in-production"
      token-expire-hours: 24

logging:
  level:
    com.credit.platform: INFO
    com.credit.platform.server.provider: DEBUG
