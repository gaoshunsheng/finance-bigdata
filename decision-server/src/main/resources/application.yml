server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: decision-server
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# 决策引擎配置
decision:
  engine:
    # 线程池配置
    thread-pool:
      # DAG 并行执行线程池
      dag-execution:
        core-size: 8
        max-size: 32
        queue-capacity: 200
        thread-name-prefix: dag-exec-
      # 外部 API 调用线程池
      external-api:
        core-size: 4
        max-size: 16
        queue-capacity: 100
        thread-name-prefix: ext-api-
    # 缓存配置
    cache:
      max-size: 10000
      max-versions: 5
      expire-hours: 24
    # 限流配置
    rate-limit:
      enabled: true
      max-requests-per-second: 500
    # 鉴权配置
    auth:
      enabled: true
      secret-key: "change-me-in-production"
      token-expire-hours: 24
    # 外部 API 适配器配置
    external-api:
      enabled: true
      mock-mode: true
      timeout-ms: 3000
      retry-count: 1
      cache-ttl-ms: 3600000
      adapters:
        credit-bureau:
          enabled: true
          mock-mode: true
          url: ${CREDIT_BUREAU_URL:http://localhost:9090}
        business-registration:
          enabled: true
          mock-mode: true
          url: ${BUSINESS_REG_URL:http://localhost:9091}
        judicial:
          enabled: true
          mock-mode: true
          url: ${JUDICIAL_URL:http://localhost:9092}
        telecom:
          enabled: true
          mock-mode: true
          url: ${TELECOM_URL:http://localhost:9093}
        tax-social:
          enabled: true
          mock-mode: true
          url: ${TAX_SOCIAL_URL:http://localhost:9094}
        blacklist:
          enabled: true
          mock-mode: true
          url: ${BLACKLIST_URL:http://localhost:9095}

# 特征存储配置 — L2 缓存变量 (Redis/HBase)
feature:
  store:
    enabled: ${FEATURE_STORE_ENABLED:false}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout-ms: 3000
    hbase:
      zk-quorum: ${HBASE_ZK_QUORUM:localhost}
      zk-port: ${HBASE_ZK_PORT:2181}
      table-name: customer_feature
      column-family: cf
      rpc-timeout-ms: 5000
      operation-timeout-ms: 10000
    cache:
      redis-ttl-hours: 1
      feature-types: credit_query_3m,overdue_6m,apply_freq_1m,transaction_summary_1h,credit_score,risk_level
      query-timeout-ms: 200
      max-retries: 1

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.credit.platform: INFO
    com.credit.platform.server.provider: DEBUG
