# ============================================================================
# 数据生成器配置文件
# 描述: MySQL / Kafka / Redis / HBase / ES / Decision Server 连接参数 + 生成参数
# 所有参数均可通过环境变量覆盖，环境变量名 = YAML 路径大写 + 下划线连接
# 例如: mysql.host -> MYSQL_HOST, kafka.bootstrap_servers -> KAFKA_BOOTSTRAP_SERVERS
# ============================================================================

mysql:
  host: "localhost"
  port: 3306
  user: "credit_admin"
  password: "credit_pass_2024"
  database: "credit_platform"

kafka:
  bootstrap_servers: "localhost:9093"   # 宿主机使用 PLAINTEXT_HOST 监听器 (9093)
  topics:
    # 短名 topics (Flink 实时作业消费)
    credit_query: "cdc_credit_query"
    overdue_event: "cdc_overdue_event"
    application_event: "application_event"
    transaction_event: "transaction_event"
    # 长名 topics (CP4 Canal CDC 验证用)
    long_customer: "cdc_credit_platform_customer_info"
    long_loan: "cdc_credit_platform_loan_application"
    long_repayment: "cdc_credit_platform_repayment_record"
    long_credit: "cdc_credit_platform_credit_report"

redis:
  host: "localhost"
  port: 6379
  password: "redis_pass_2024"
  key_prefix: "feature:"
  ttl: 86400    # 24 小时 (秒)

hbase:
  zk_quorum: "localhost"
  zk_port: 2181
  table: "customer_feature"
  column_family: "cf"

decision:
  url: "http://localhost:18080/api/v1/decision"
  strategy_id: "STR_CREDIT_V3"

elasticsearch:
  host: "localhost"
  port: 9200
  index_prefix: "decision-log-"

hdfs:
  namenode_url: "http://localhost:9870"   # WebHDFS
  base_path: "/data/ods"

hive:
  host: "localhost"
  port: 10000
  database: "default"

generation:
  customer_count: 10000
  months: 12
  start_date: "2025-07-01"
  rate: 20             # 每秒事件数
  seed: 42
  batch_size: 1000     # 每 N 行一次 INSERT
  tiers:
    premium: 0.40
    normal: 0.30
    high_risk: 0.20
    anomaly: 0.10

# ============================================================================
# 决策引擎种子数据生成参数
# ============================================================================
decision_seed:
  # 评分卡基准参数
  scorecard:
    credit_a:
      initial_score: 500
      cutoff_reject: 500      # <500: REJECT
      cutoff_review: 550      # 500-549: REVIEW, >=550: PASS
    credit_b:
      initial_score: 0
      cutoff_reject: 300
      cutoff_review: 350
    credit_c:
      initial_score: 0
      cutoff_reject: 250
      cutoff_review: 300

  # 准入阈值
  eligibility:
    age_min: 22
    age_max: 60
    income_min: 3000          # 最低月收入
    credit_query_max: 6       # 最大征信查询次数 (近3月)
    debt_ratio_max: 0.70      # 最大负债率

  # 反欺诈阈值
  blacklist:
    multi_loan_threshold: 5   # 多头借贷次数阈值

  # 额度矩阵 (元)
  loan_amount:
    grade_a_max: 500000       # A级客户最大额度
    grade_b_max: 300000
    grade_c_max: 100000
    grade_d_max: 0            # D级直接拒贷
    product_p001_max: 500000  # 消费贷上限
    product_p002_max: 2000000 # 经营贷上限
    product_p003_max: 5000000 # 房贷上限

  # 定价矩阵 (年化利率 %)
  pricing:
    grade_a_rate: 6.0         # A级基准利率
    grade_b_rate: 9.0
    grade_c_rate: 12.0
    grade_d_rate: 18.0
    short_term_discount: -0.5 # 短期 (≤12月) 优惠
    long_term_premium: 2.0    # 长期 (>36月) 上浮
    guarantee_discount: -1.0  # 有担保优惠

  # 实验流量比例
  experiment:
    credit_strategy:
      control_ratio: 0.5
      experiment_ratio: 0.5
    pricing_model:
      control_ratio: 0.7
      experiment_ratio: 0.3

  # 灰度上线时间线 (北京时间)
  grayscale:
    blacklist:
      start_pct: 10
      expand_pct: 50
      full_pct: 100
      start_time: "2026-06-01 10:00:00"
      expand_time: "2026-06-02 14:00:00"
      full_time: "2026-06-03 18:00:00"

# ============================================================================
# 端到端执行器参数
# ============================================================================
decision_runner:
  default_strategy: "FLOW_CREDIT_MAIN"
  default_channel: "APP"
  concurrency: 4            # 默认并发度
  retry_max: 3              # 最大重试次数
  retry_backoff: [1, 2, 4]  # 退避间隔 (秒)
  request_timeout: 10       # 单次请求超时 (秒)
  es_batch_size: 100        # ES 批量写入大小
