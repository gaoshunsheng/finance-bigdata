# ============================================================================
# 数据生成器配置文件
# 描述: MySQL / Kafka / Redis / HBase / ES / Decision Server 连接参数 + 生成参数
# 所有参数均可通过环境变量覆盖，环境变量名 = YAML 路径大写 + 下划线连接
# 例如: mysql.host -> MYSQL_HOST, kafka.bootstrap_servers -> KAFKA_BOOTSTRAP_SERVERS
# ============================================================================

mysql:
  host: "localhost"
  port: 3306
  user: "credit_admin"
  password: "credit_pass_2024"
  database: "credit_platform"

kafka:
  bootstrap_servers: "localhost:9093"   # 宿主机使用 PLAINTEXT_HOST 监听器 (9093)
  topics:
    # 短名 topics (Flink 实时作业消费)
    credit_query: "cdc_credit_query"
    overdue_event: "cdc_overdue_event"
    application_event: "application_event"
    transaction_event: "transaction_event"
    # 长名 topics (CP4 Canal CDC 验证用)
    long_customer: "cdc_credit_platform_customer_info"
    long_loan: "cdc_credit_platform_loan_application"
    long_repayment: "cdc_credit_platform_repayment_record"
    long_credit: "cdc_credit_platform_credit_report"

redis:
  host: "localhost"
  port: 6379
  password: "redis_pass_2024"
  key_prefix: "feature:"
  ttl: 86400    # 24 小时 (秒)

hbase:
  zk_quorum: "localhost"
  zk_port: 2181
  table: "customer_feature"
  column_family: "cf"

decision:
  url: "http://localhost:18080/api/v1/decision"
  strategy_id: "STR_CREDIT_V3"

elasticsearch:
  host: "localhost"
  port: 9200
  index_prefix: "decision-log-"

hdfs:
  namenode_url: "http://localhost:9870"   # WebHDFS
  base_path: "/data/ods"

hive:
  host: "localhost"
  port: 10000
  database: "default"

generation:
  customer_count: 10000
  months: 12
  start_date: "2025-07-01"
  rate: 20             # 每秒事件数
  seed: 42
  batch_size: 1000     # 每 N 行一次 INSERT
  tiers:
    premium: 0.40
    normal: 0.30
    high_risk: 0.20
    anomaly: 0.10
