# Local port overrides — avoid conflicts with existing services
services:
  decision-server:
    ports:
      - "18080:8080"
    environment:
      DECISION_ENGINE_RATE_LIMIT_ENABLED: "false"    # 测试环境禁用限流

  decision-admin:
    ports:
      - "18081:8081"

  model-platform:
    ports:
      - "18082:8082"

  data-service:
    ports:
      - "18083:8083"

  # Flink 测试窗口参数 — 生产环境不设这些变量即使用代码中的默认值
  # 测试环境按比例缩小: 天→分钟, 用于加速实时特征计算验证
  flink-jobmanager:
    environment:
      FLINK_WINDOW_SIZE_MS: "60000"       # 1 分钟 (测试用，生产: 90天)
      FLINK_WINDOW_SLIDE_MS: "10000"      # 10 秒  (测试用，生产: 1小时)
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      REDIS_URI: "redis://:redis_pass_2024@redis:6379"
      HBASE_ZK_QUORUM: "finance-hbase-master"
      HBASE_ZK_PORT: "2181"
      ES_HOST: "finance-elasticsearch"
      ES_PORT: "9200"

  flink-taskmanager:
    environment:
      FLINK_WINDOW_SIZE_MS: "60000"
      FLINK_WINDOW_SLIDE_MS: "10000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      REDIS_URI: "redis://:redis_pass_2024@redis:6379"
      HBASE_ZK_QUORUM: "finance-hbase-master"
      HBASE_ZK_PORT: "2181"
      ES_HOST: "finance-elasticsearch"
      ES_PORT: "9200"
