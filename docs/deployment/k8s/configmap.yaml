apiVersion: v1
kind: ConfigMap
metadata:
  name: finance-platform-config
  namespace: finance-platform
  labels:
    app.kubernetes.io/part-of: finance-bigdata-platform
data:
  # --- Common ---
  TZ: "Asia/Shanghai"
  SPRING_JACKSON_DATE_FORMAT: "yyyy-MM-dd HH:mm:ss"
  SPRING_JACKSON_TIME_ZONE: "Asia/Shanghai"
  SPRING_JACKSON_DEFAULT_PROPERTY_INCLUSION: "non_null"

  # --- Database ---
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-svc:3306/credit_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"

  # --- Redis ---
  SPRING_DATA_REDIS_HOST: "redis-svc"
  SPRING_DATA_REDIS_PORT: "6379"

  # --- Elasticsearch ---
  ELASTICSEARCH_URL: "http://elasticsearch-svc:9200"

  # --- Decision Engine ---
  DECISION_ENGINE_CACHE_MAX_SIZE: "10000"
  DECISION_ENGINE_CACHE_MAX_VERSIONS: "5"
  DECISION_ENGINE_CACHE_EXPIRE_HOURS: "24"
  DECISION_ENGINE_RATE_LIMIT_ENABLED: "true"
  DECISION_ENGINE_RATE_LIMIT_MAX_REQUESTS_PER_SECOND: "500"
  DECISION_ENGINE_THREAD_POOL_DAG_EXECUTION_CORE_SIZE: "8"
  DECISION_ENGINE_THREAD_POOL_DAG_EXECUTION_MAX_SIZE: "32"
  DECISION_ENGINE_THREAD_POOL_DAG_EXECUTION_QUEUE_CAPACITY: "200"
  DECISION_ENGINE_THREAD_POOL_EXTERNAL_API_CORE_SIZE: "4"
  DECISION_ENGINE_THREAD_POOL_EXTERNAL_API_MAX_SIZE: "16"
  DECISION_ENGINE_THREAD_POOL_EXTERNAL_API_QUEUE_CAPACITY: "100"

  # --- Security ---
  DECISION_SECURITY_ENABLED: "true"
  DECISION_ENGINE_AUTH_ENABLED: "true"
  DECISION_ENGINE_AUTH_TOKEN_EXPIRE_HOURS: "24"

  # --- Model Platform ---
  APP_HOST: "0.0.0.0"
  APP_PORT: "8082"
  APP_WORKERS: "4"
  MODEL_STORAGE_PATH: "/app/storage/models"
  DATA_STORAGE_PATH: "/app/storage/data"
  REPORT_STORAGE_PATH: "/app/storage/reports"

  # --- Logging ---
  LOGGING_LEVEL_COM_CREDIT_PLATFORM: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: finance-platform-secrets
  namespace: finance-platform
  labels:
    app.kubernetes.io/part-of: finance-bigdata-platform
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "credit_admin"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  SPRING_DATA_REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  DECISION_ENGINE_AUTH_SECRET_KEY: "CHANGE_ME_JWT_SECRET_KEY"
  DECISION_SECURITY_SECRET_KEY: "CHANGE_ME_ADMIN_JWT_SECRET"
  DATABASE_URL: "mysql+pymysql://credit_admin:CHANGE_ME_DB_PASSWORD@mysql-svc:3306/credit_platform?charset=utf8mb4"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_MYSQL_ROOT_PASSWORD"
  MYSQL_PASSWORD: "CHANGE_ME_DB_PASSWORD"
