apiVersion: apps/v1
kind: Deployment
metadata:
  name: dolphinscheduler
  namespace: finance-platform
  labels:
    app: dolphinscheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dolphinscheduler
  template:
    metadata:
      labels:
        app: dolphinscheduler
    spec:
      containers:
        - name: dolphinscheduler
          image: apache/dolphinscheduler-standalone-server:3.2.1
          ports:
            - containerPort: 12345
            - containerPort: 25333
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: DATABASE_TYPE
              value: "mysql"
            - name: DATABASE_HOST
              value: "mysql"
            - name: DATABASE_PORT
              value: "3306"
            - name: DATABASE_USERNAME
              value: "root"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: mysql-password
            - name: DATABASE_DATABASE
              value: "dolphinscheduler"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: dolphinscheduler
  namespace: finance-platform
spec:
  selector:
    app: dolphinscheduler
  ports:
    - name: api
      port: 12345
      targetPort: 12345
      nodePort: 32345
    - name: python
      port: 25333
      targetPort: 25333
  type: NodePort
