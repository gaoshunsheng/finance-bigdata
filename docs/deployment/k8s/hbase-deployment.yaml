# ============================================================================
# HBase Master + RegionServer Deployments
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbase-master
  namespace: finance-platform
  labels:
    app: hbase-master
    app.kubernetes.io/part-of: finance-bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hbase-master
  template:
    metadata:
      labels:
        app: hbase-master
    spec:
      containers:
        - name: hbase-master
          image: harisekhon/hbase:2.5
          ports:
            - containerPort: 16010
            - containerPort: 16000
          env:
            - name: HBASE_CONF_hbase_rootdir
              value: "hdfs://hadoop-namenode-svc:9000/hbase"
            - name: HBASE_CONF_hbase_cluster_distributed
              value: "true"
            - name: HBASE_CONF_hbase_zookeeper_quorum
              value: "zookeeper-svc:2181"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 16010
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 16010
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hbase-master-svc
  namespace: finance-platform
  labels:
    app: hbase-master
    app.kubernetes.io/part-of: finance-bigdata
spec:
  selector:
    app: hbase-master
  ports:
    - name: webui
      port: 16010
      targetPort: 16010
      protocol: TCP
    - name: rpc
      port: 16000
      targetPort: 16000
      protocol: TCP
  type: ClusterIP
---
# HBase RegionServer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbase-regionserver
  namespace: finance-platform
  labels:
    app: hbase-regionserver
    app.kubernetes.io/part-of: finance-bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hbase-regionserver
  template:
    metadata:
      labels:
        app: hbase-regionserver
    spec:
      containers:
        - name: hbase-regionserver
          image: harisekhon/hbase:2.5
          command: ["/hbase/bin/hbase", "regionserver", "start"]
          env:
            - name: HBASE_CONF_hbase_rootdir
              value: "hdfs://hadoop-namenode-svc:9000/hbase"
            - name: HBASE_CONF_hbase_cluster_distributed
              value: "true"
            - name: HBASE_CONF_hbase_zookeeper_quorum
              value: "zookeeper-svc:2181"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
