# ============================================================================
# Hive Metastore + HiveServer2 Deployments
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: finance-platform
  labels:
    app: hive-metastore
    app.kubernetes.io/part-of: finance-bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      containers:
        - name: hive-metastore
          image: apache/hive:3.1.3
          command: ["/opt/hive/bin/metastore"]
          ports:
            - containerPort: 9083
          env:
            - name: SERVICE_NAME
              value: "metastore"
            - name: DB_DRIVER
              value: "mysql"
            - name: METASTORE_DB_URL
              value: "jdbc:mysql://mysql-svc:3306/hive_metastore?createDatabaseIfNotExist=true"
            - name: METASTORE_DB_USER
              value: "root"
            - name: METASTORE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-platform-secrets
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore-svc
  namespace: finance-platform
  labels:
    app: hive-metastore
    app.kubernetes.io/part-of: finance-bigdata
spec:
  selector:
    app: hive-metastore
  ports:
    - port: 9083
      targetPort: 9083
      protocol: TCP
  type: ClusterIP
---
# HiveServer2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-server
  namespace: finance-platform
  labels:
    app: hive-server
    app.kubernetes.io/part-of: finance-bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-server
  template:
    metadata:
      labels:
        app: hive-server
    spec:
      containers:
        - name: hive-server
          image: apache/hive:3.1.3
          command: ["/opt/hive/bin/hiveserver2"]
          ports:
            - containerPort: 10000
            - containerPort: 10002
          env:
            - name: SERVICE_NAME
              value: "hiveserver2"
            - name: IS_RESUME
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hive-server-svc
  namespace: finance-platform
  labels:
    app: hive-server
    app.kubernetes.io/part-of: finance-bigdata
spec:
  selector:
    app: hive-server
  ports:
    - name: thrift
      port: 10000
      targetPort: 10000
      protocol: TCP
    - name: webui
      port: 10002
      targetPort: 10002
      protocol: TCP
  type: ClusterIP
