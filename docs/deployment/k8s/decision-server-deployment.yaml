apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-server
  namespace: finance-platform
  labels:
    app: decision-server
    app.kubernetes.io/part-of: finance-bigdata-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: decision-server
  template:
    metadata:
      labels:
        app: decision-server
    spec:
      containers:
        - name: decision-server
          image: finance-bigdata/decision-server:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: finance-platform-config
            - secretRef:
                name: finance-platform-secrets
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_APPLICATION_NAME
              value: "decision-server"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: decision-server-svc
  namespace: finance-platform
  labels:
    app: decision-server
spec:
  selector:
    app: decision-server
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
