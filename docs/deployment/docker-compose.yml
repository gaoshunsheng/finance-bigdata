version: "3.9"

# ============================================================================
# Finance Bigdata Platform - Docker Compose Orchestration
# ============================================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f <service>  # Follow logs
#   docker compose down -v            # Stop and remove volumes
# ============================================================================

x-common-env: &common-env
  TZ: "Asia/Shanghai"
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure: MySQL 8.0
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-credit_platform}
      MYSQL_USER: ${MYSQL_USER:-credit_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-credit_pass_2024}
      TZ: "Asia/Shanghai"
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-conf:/etc/mysql/conf.d
      - ./init-sql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --slow-query-log=ON
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Infrastructure: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: finance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_pass_2024}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2024}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Infrastructure: Elasticsearch 8
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: finance-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.name: finance-cluster
      bootstrap.memory_lock: "true"
      TZ: "Asia/Shanghai"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Application: Decision Server (port 8080)
  # ---------------------------------------------------------------------------
  decision-server:
    build:
      context: ../..
      dockerfile: docs/deployment/Dockerfile.java
      args:
        SERVICE_NAME: decision-server
        MAVEN_PROFILE: prod
    container_name: finance-decision-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: decision-server
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-credit_platform}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-credit_admin}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-credit_pass_2024}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2024}
      DECISION_ENGINE_CACHE_MAX_SIZE: "10000"
      DECISION_ENGINE_RATE_LIMIT_MAX_REQUESTS_PER_SECOND: "500"
      DECISION_ENGINE_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Application: Decision Admin (port 8081)
  # ---------------------------------------------------------------------------
  decision-admin:
    build:
      context: ../..
      dockerfile: docs/deployment/Dockerfile.java
      args:
        SERVICE_NAME: decision-admin
        MAVEN_PROFILE: prod
    container_name: finance-decision-admin
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      SERVER_PORT: "8081"
      SPRING_APPLICATION_NAME: decision-admin
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-credit_platform}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-credit_admin}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-credit_pass_2024}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2024}
      DECISION_SECURITY_ENABLED: "true"
      DECISION_SECURITY_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Application: Model Platform (port 8082)
  # ---------------------------------------------------------------------------
  model-platform:
    build:
      context: ../../model-platform
      dockerfile: Dockerfile
    container_name: finance-model-platform
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TZ: "Asia/Shanghai"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8082"
      APP_WORKERS: "4"
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-credit_admin}:${MYSQL_PASSWORD:-credit_pass_2024}@mysql:3306/${MYSQL_DATABASE:-credit_platform}?charset=utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2024}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MODEL_STORAGE_PATH: /app/storage/models
      DATA_STORAGE_PATH: /app/storage/data
      REPORT_STORAGE_PATH: /app/storage/reports
    volumes:
      - model-storage:/app/storage/models
      - model-data:/app/storage/data
      - model-reports:/app/storage/reports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finance-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql-data:
    driver: local
  mysql-conf:
    driver: local
  redis-data:
    driver: local
  es-data:
    driver: local
  es-plugins:
    driver: local
  model-storage:
    driver: local
  model-data:
    driver: local
  model-reports:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  finance-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
