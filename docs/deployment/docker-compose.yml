version: "3.9"

# ============================================================================
# Finance Bigdata Platform - Docker Compose Orchestration
# ============================================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f <service>  # Follow logs
#   docker compose down -v            # Stop and remove volumes
# ============================================================================

x-common-env: &common-env
  TZ: "Asia/Shanghai"
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure: MySQL 8.0
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-credit_platform}
      MYSQL_USER: ${MYSQL_USER:-credit_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-credit_pass_2024}
      TZ: "Asia/Shanghai"
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-conf:/etc/mysql/conf.d
      - ./init-sql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --slow-query-log=ON
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Infrastructure: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: finance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_pass_2024}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2024}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Infrastructure: Elasticsearch 8
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: finance-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.name: finance-cluster
      bootstrap.memory_lock: "true"
      TZ: "Asia/Shanghai"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Application: Decision Server (port 8080)
  # ---------------------------------------------------------------------------
  decision-server:
    build:
      context: ../..
      dockerfile: docs/deployment/Dockerfile.java
      args:
        SERVICE_NAME: decision-server
        MAVEN_PROFILE: prod
    container_name: finance-decision-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: decision-server
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-credit_platform}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-credit_admin}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-credit_pass_2024}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2024}
      DECISION_ENGINE_CACHE_MAX_SIZE: "10000"
      DECISION_ENGINE_RATE_LIMIT_MAX_REQUESTS_PER_SECOND: "500"
      DECISION_ENGINE_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/decision/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Application: Decision Admin (port 8081)
  # ---------------------------------------------------------------------------
  decision-admin:
    build:
      context: ../..
      dockerfile: docs/deployment/Dockerfile.java
      args:
        SERVICE_NAME: decision-admin
        MAVEN_PROFILE: prod
    container_name: finance-decision-admin
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      SERVER_PORT: "8081"
      SPRING_APPLICATION_NAME: decision-admin
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-credit_platform}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-credit_admin}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-credit_pass_2024}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2024}
      DECISION_SECURITY_ENABLED: "true"
      DECISION_SECURITY_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Application: Model Platform (port 8082)
  # ---------------------------------------------------------------------------
  model-platform:
    build:
      context: ../../model-platform
      dockerfile: Dockerfile
    container_name: finance-model-platform
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TZ: "Asia/Shanghai"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8082"
      APP_WORKERS: "1"
      MODEL_PLATFORM_HOST: "0.0.0.0"
      MODEL_PLATFORM_PORT: "8082"
      MODEL_PLATFORM_DB_URL: mysql+pymysql://${MYSQL_USER:-credit_admin}:${MYSQL_PASSWORD:-credit_pass_2024}@mysql:3306/model_platform?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-credit_admin}:${MYSQL_PASSWORD:-credit_pass_2024}@mysql:3306/model_platform?charset=utf8mb4
      MODEL_PLATFORM_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2024}@redis:6379/2
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2024}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MODEL_STORAGE_PATH: /app/storage/models
      DATA_STORAGE_PATH: /app/storage/data
      REPORT_STORAGE_PATH: /app/storage/reports
    volumes:
      - model-storage:/app/storage/models
      - model-data:/app/storage/data
      - model-reports:/app/storage/reports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: ZooKeeper
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: finance-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: Kafka
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: finance-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: HDFS NameNode
  # ---------------------------------------------------------------------------
  hadoop-namenode:
    image: apache/hadoop:3.3.6
    container_name: finance-namenode
    hostname: namenode
    restart: unless-stopped
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      ENSURE_NAMENODE_DIR: "/opt/hadoop/dfs/name"
    volumes:
      - hadoop-nn-data:/opt/hadoop/dfs/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: HDFS DataNode
  # ---------------------------------------------------------------------------
  hadoop-datanode:
    image: apache/hadoop:3.3.6
    container_name: finance-datanode
    hostname: datanode
    restart: unless-stopped
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_NAMENODE_HOST: "namenode"
    depends_on:
      - hadoop-namenode
    volumes:
      - hadoop-dn-data:/opt/hadoop/dfs/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: Hive Metastore
  # ---------------------------------------------------------------------------
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: finance-hive-metastore
    restart: unless-stopped
    command: ["/opt/hive/bin/metastore"]
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: "metastore"
      DB_DRIVER: "mysql"
      IS_RESUME: "true"
    volumes:
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./hive/lib/mysql-connector-j.jar:/opt/hive/lib/mysql-connector-j.jar:ro
    depends_on:
      - mysql
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: HiveServer2
  # ---------------------------------------------------------------------------
  hive-server:
    image: apache/hive:3.1.3
    container_name: finance-hive-server
    restart: unless-stopped
    command: ["/opt/hive/bin/hiveserver2"]
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: "hiveserver2"
      IS_RESUME: "true"
    volumes:
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./hive/lib/mysql-connector-j.jar:/opt/hive/lib/mysql-connector-j.jar:ro
    depends_on:
      - hive-metastore
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: HBase Master
  # ---------------------------------------------------------------------------
  hbase-master:
    image: harisekhon/hbase:latest
    container_name: finance-hbase-master
    hostname: hbase-master
    restart: unless-stopped
    ports:
      - "16010:16010"
      - "16000:16000"
    environment:
      HBASE_CONF_hbase_rootdir: "hdfs://namenode:9000/hbase"
      HBASE_CONF_hbase_cluster_distributed: "true"
      HBASE_CONF_hbase_zookeeper_quorum: "zookeeper:2181"
    depends_on:
      - hadoop-namenode
      - zookeeper
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: Flink JobManager
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.18.1-java17
    container_name: finance-flink-jobmanager
    restart: unless-stopped
    command: ["jobmanager"]
    ports:
      - "8088:8081"
      - "6123:6123"
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Big Data: Flink TaskManager
  # ---------------------------------------------------------------------------
  flink-taskmanager:
    image: flink:1.18.1-java17
    container_name: finance-flink-taskmanager
    restart: unless-stopped
    command: ["taskmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    depends_on:
      - flink-jobmanager
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Application: Data Service (port 8083)
  # ---------------------------------------------------------------------------
  data-service:
    build:
      context: ../..
      dockerfile: docs/deployment/Dockerfile.java
      args:
        SERVICE_NAME: data-platform/data-service
    container_name: finance-data-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: "prod"
      REDIS_HOST: "redis"
      HBASE_ZK_QUORUM: "zookeeper"
      ES_HOST: "elasticsearch"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8083' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      - redis
      - kafka
      - hadoop-namenode
      - elasticsearch
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Trino (Presto) — Federated Query Engine
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:435
    container_name: finance-trino
    restart: unless-stopped
    ports:
      - "8084:8080"
    volumes:
      - ./trino/etc:/etc/trino
      - ./hadoop/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/etc/hadoop/conf/hdfs-site.xml:ro
    depends_on:
      - hive-server
      - mysql
      - hbase-master
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # DolphinScheduler — Task Scheduling Platform
  # ---------------------------------------------------------------------------
  dolphinscheduler-standalone:
    image: apache/dolphinscheduler-standalone-server:3.2.1
    container_name: finance-dolphinscheduler
    restart: unless-stopped
    ports:
      - "12345:12345"
      - "25333:25333"
    environment:
      <<: *common-env
      TZ: "Asia/Shanghai"
      DATABASE_TYPE: "mysql"
      DATABASE_HOST: "mysql"
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: "root"
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      DATABASE_DATABASE: "dolphinscheduler"
    depends_on:
      - mysql
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Application: Decision UI (Vue 3 + Nginx)
  # ---------------------------------------------------------------------------
  decision-ui:
    build:
      context: ../../decision-ui
      dockerfile: Dockerfile
    container_name: finance-decision-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Logging: Filebeat — Log collection pipeline
  # ---------------------------------------------------------------------------
  filebeat:
    image: elastic/filebeat:8.13.4
    container_name: finance-filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-data:/usr/share/filebeat/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: "Asia/Shanghai"
    command: ["--strict.perms=false"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Data Pipeline: Canal — MySQL CDC → Kafka
  # ---------------------------------------------------------------------------
  canal:
    image: canal/canal-server:v1.1.7
    container_name: finance-canal
    restart: unless-stopped
    ports:
      - "11111:11111"
    environment:
      canal.auto.scan: "false"
      canal.destinations: "credit_platform"
      canal.serverMode: "kafka"
      canal.mq.servers: "kafka:9092"
      kafka.bootstrap.servers: "kafka:9092"
      TZ: "Asia/Shanghai"
    volumes:
      - ./canal/instance.properties:/home/admin/canal-server/conf/credit_platform/instance.properties:ro
    depends_on:
      - mysql
      - kafka
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Data Pipeline: DataX — Batch data sync (MySQL → HDFS)
  # ---------------------------------------------------------------------------
  datax:
    build:
      context: .
      dockerfile: Dockerfile.datax
    container_name: finance-datax
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      DATAX_HOME: "/opt/datax"
    volumes:
      - ../../data-pipeline/datax/jobs:/datax/job:ro
      - ../../data-pipeline/datax/run_daily_sync.sh:/datax/run_daily_sync.sh:ro
      - ./hadoop-conf:/etc/hadoop:ro
    depends_on:
      - mysql
      - hadoop-namenode
    networks:
      - finance-net

  # ---------------------------------------------------------------------------
  # Data Pipeline: Spark — Offline ETL engine
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.0
    container_name: finance-spark-master
    hostname: spark-master
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command: ["/opt/spark/sbin/start-master.sh", "-p", "7077", "--webui-port", "8085"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HOME: "/opt/spark"
      HADOOP_CONF_DIR: "/opt/hadoop/conf"
      TZ: "Asia/Shanghai"
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/conf/hdfs-site.xml:ro
      - ./hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    ports:
      - "18085:8085"
      - "7077:7077"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finance-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: finance-spark-worker
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HOME: "/opt/spark"
      HADOOP_CONF_DIR: "/opt/hadoop/conf"
      SPARK_WORKER_MEMORY: "1g"
      SPARK_WORKER_CORES: "1"
      TZ: "Asia/Shanghai"
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/conf/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/conf/hdfs-site.xml:ro
      - ./hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - finance-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql-data:
    driver: local
  mysql-conf:
    driver: local
  redis-data:
    driver: local
  es-data:
    driver: local
  es-plugins:
    driver: local
  model-storage:
    driver: local
  model-data:
    driver: local
  model-reports:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  hadoop-nn-data:
    driver: local
  hadoop-dn-data:
    driver: local
  filebeat-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  finance-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
