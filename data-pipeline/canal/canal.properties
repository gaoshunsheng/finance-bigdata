#################################################
# Canal全局配置文件
# 描述: Canal Server全局参数配置，控制Canal实例的基本行为
# 文件路径: conf/canal.properties
# 创建时间: 2026-06-06
#################################################

# ==================== Canal Server基础配置 ====================
# Canal唯一标识（集群模式下每个节点需不同）
canal.id = 1

# Canal Server绑定的IP地址（留空表示绑定所有网卡）
canal.ip =

# Canal Server监听端口，客户端通过此端口订阅Binlog数据
canal.port = 11111

# Canal Server metrics监控端口（Prometheus采集用）
canal.metrics.pull.port = 11112

# ==================== ZooKeeper配置 ====================
# ZooKeeper集群地址（集群模式必填，单机模式留空）
# 格式: host1:2181,host2:2181,host3:2181
canal.zkServers =

# ZooKeeper会话超时时间（毫秒）
canal.zookeeper.flush.period = 1000

# ==================== 存储配置 ====================
# Binlog数据的持久化模式
# - memory: 仅存储在内存中，速度快但重启丢失
# - zookeeper: 存储在ZK中，适合集群模式
# - mixed: 混合模式，内存+持久化
# - file: 本地文件存储（standalone推荐）
canal.instance.global.spring.xml = classpath:spring/default-instance.xml

# ==================== 内存存储配置 ====================
# 内存存储的Binlog事件环形缓冲区大小
canal.instance.memory.buffer.size = 16384

# 内存存储环形缓冲区最小可用空间（低于此值时暂停读取）
canal.instance.memory.buffer.memunit = 1024

# 内存存储模式: ITEMSIZE（按条数）或 MEMSIZE（按字节）
canal.instance.memory.buffer.memtype = MEMSIZE

# ==================== 自动发现配置 ====================
# 是否开启自动扫描instance目录（conf/下每个子目录视为一个instance）
canal.auto.scan = true

# 自动扫描间隔（秒）
canal.auto.scan.interval = 5

# ==================== Canal Admin配置 ====================
# Canal Admin管理后台地址（如果使用Canal Admin统一管理）
# canal.admin.manager = 127.0.0.1:8089
# canal.admin.port = 11110
# canal.admin.user = admin
# canal.admin.passwd = 4ACFE3202A5FF5CF467898FC58AAB1D615029441

# ==================== 日志配置 ====================
# Canal日志级别: INFO, WARN, ERROR, DEBUG
canal.log.level = INFO
