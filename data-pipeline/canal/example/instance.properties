#################################################
# Canal实例配置文件 - example实例
# 描述: 配置Canal监听MySQL Binlog的实例参数
# 文件路径: conf/example/instance.properties
# 用途: 监听credit_platform数据库的Binlog变更，实时同步到下游
# 创建时间: 2026-06-06
#################################################

# ==================== MySQL主库连接配置 ====================
# MySQL主库地址（host:port）
canal.instance.master.address = mysql:3306

# MySQL主库Binlog文件名（留空则自动获取最新位置）
canal.instance.master.journal.name =

# MySQL主库Binlog偏移量（留空则自动获取最新位置）
canal.instance.master.position =

# MySQL主库Binlog时间戳（留空则自动获取）
canal.instance.master.timestamp =

# MySQL主从切换时的备库地址（GTID模式下使用）
# canal.instance.standby.address =

# ==================== MySQL账号配置 ====================
# Canal连接MySQL使用的数据库账号（需要有REPLICATION SLAVE和REPLICATION CLIENT权限）
canal.instance.dbUsername = canal

# Canal连接MySQL使用的数据库密码
canal.instance.dbPassword = canal123

# 连接MySQL时使用的默认编码
canal.instance.connectionCharset = UTF-8

# 连接MySQL时使用的默认数据库
canal.instance.defaultDatabaseName = credit_platform

# ==================== MySQL服务器配置 ====================
# MySQL serverId（必须确保集群内唯一，且不能与MySQL主从的serverId冲突）
canal.instance.tsdb.spring.xml =

# ==================== 数据过滤配置 ====================
# 监听的数据库和表，使用正则表达式匹配
# 格式: 数据库.表名，多个用逗号分隔
# 示例: credit_platform\..* 表示监听credit_platform库下所有表
canal.instance.filter.regex = credit_platform\\..*

# 排除的数据库和表（黑名单）
canal.instance.filter.black.regex =

# 数据字段过滤（仅同步需要的字段，减少网络传输）
# canal.instance.filter.field =

# ==================== Binlog解析配置 ====================
# Binlog解析模式: ROW（行级变更，推荐）、STATEMENT（语句级）、MIXED（混合）
canal.instance.binlog.format = ROW

# Binlog镜像模式（用于数据校验）
canal.instance.binlog.image = FULL

# ==================== GTID配置 ====================
# 是否启用GTID模式（MySQL 5.6+支持）
canal.instance.gtidon = false

# ==================== 数据库时序存储配置 ====================
# 数据库变更时间戳存储（用于记录Binlog消费位置）
# canal.instance.tsdb.spring.xml = classpath:spring/tsdb/h2-tsdb.xml

# ==================== 连接池配置 ====================
# 连接心跳检测间隔（秒）
canal.instance.network.soTimeout = 30000

# 连接空闲超时时间（秒）
canal.instance.network.idleTimeout = 60000

# ==================== 消费者配置 ====================
# 单次批量获取的最大Binlog事件条数
canal.instance.memory.batch.mode = MEMSIZE

# ==================== SINK配置 ====================
# SINK线程数（并发写入下游的线程数）
canal.instance.sink.thread.size = 8

# ==================== 数据过滤规则详细配置 ====================
# 按表级别的DML类型过滤（INSERT/UPDATE/DELETE）
# 格式: 数据库.表名:事件类型，多个用逗号分隔
# 示例: credit_platform\\.loan_application:INSERT,UPDATE
# canal.instance.filter.dml =
