# ============================================================================
# Fluentd配置文件
# 描述: 统一日志采集、解析和分发配置
# 文件路径: /etc/fluentd/fluent.conf
# 用途: 采集应用日志和访问日志，解析后分发到Kafka和Elasticsearch
# 创建时间: 2026-06-06
# ============================================================================

# ==================== 数据源配置 ====================

# 数据源1: 采集应用日志文件
# 应用日志格式为JSON，包含日志级别、时间戳、类名、消息等字段
<source>
    @type tail
    # 应用日志文件路径（支持通配符）
    path /var/log/apps/*.log
    # 采集位置记录文件（断点续传）
    pos_file /var/log/fluentd/app.log.pos
    # 日志标签，用于路由匹配
    tag app.logs.application
    # 指定读取路径（多行日志合并）
    path_key file_path
    <parse>
        @type json
        # JSON解析失败时的时间字段
        time_key timestamp
        # 时间格式
        time_format %Y-%m-%dT%H:%M:%S.%NZ
        # 保留解析失败的原始日志
        keep_time_key true
    </parse>
    # 每行最大长度（字节）
    line_length_limit 10MB
    # 文件编码
    encoding UTF-8
</source>

# 数据源2: 采集Nginx访问日志
<source>
    @type tail
    # Nginx访问日志文件路径
    path /var/log/nginx/access.log
    # 采集位置记录文件
    pos_file /var/log/fluentd/nginx.access.log.pos
    # 访问日志标签
    tag access.logs.nginx
    <parse>
        @type regexp
        # Nginx combined日志格式的正则表达式
        expression /^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$/
        time_key time
        time_format %d/%b/%Y:%H:%M:%S %z
    </parse>
</source>

# ==================== 过滤器配置 ====================

# 过滤器1: 解析应用日志中的JSON内容并添加元数据
<filter app.logs.**>
    @type record_transformer
    <record>
        # 添加日志来源标记
        log_source "application"
        # 添加采集时间戳（北京时间）
        collect_time ${time}
        # 添加主机名
        hostname "#{Socket.gethostname}"
    </record>
</filter>

# 过滤器2: 解析访问日志并添加元数据
<filter access.logs.**>
    @type record_transformer
    <record>
        # 添加日志来源标记
        log_source "access"
        # 添加采集时间戳
        collect_time ${time}
        # 将响应码转为整数类型
        code ${record["code"].to_i}
        # 将响应大小转为整数类型
        size ${record["size"].to_i}
    </record>
</filter>

# ==================== 输出配置 ====================

# 输出1: 应用日志 -> Kafka
# 将应用日志实时投递到Kafka，供Flink消费进行实时计算
<match app.logs.**>
    @type kafka2
    # Kafka集群地址
    brokers kafka:9092
    # 目标Topic
    topic app-logs
    # 消息Key（使用应用名称作为分区键）
    message_key ${hostname}
    # 使用JSON格式输出
    <format>
        @type json
    </format>
    # Kafka生产者配置
    <inject>
        tag_key tag
        time_key time
    </inject>
    # 缓冲区配置（提高吞吐量）
    <buffer>
        @type file
        # 缓冲文件路径
        path /var/log/fluentd/buffer/app
        # 刷新间隔（秒）
        flush_interval 5s
        # 缓冲区满时的行为: exception（抛异常）
        overflow_action exception
        # 缓冲区Chunk大小限制
        chunk_limit_size 16MB
        # 缓冲区总大小限制
        total_limit_size 1GB
    </buffer>
</match>

# 输出2: 访问日志 -> Elasticsearch
# 将Nginx访问日志写入Elasticsearch，用于日志检索和访问分析看板
<match access.logs.**>
    @type elasticsearch
    # Elasticsearch集群地址
    host elasticsearch
    port 9200
    # 索引命名规则: access-logs-yyyy-MM-dd（按天分索引）
    logstash_format true
    logstash_prefix access-logs
    logstash_dateformat %Y.%m.%d
    # 索引模板配置
    template_name access-logs
    template_file /etc/fluentd/templates/access-logs-template.json
    # 使用HTTP协议
    scheme http
    # 刷新模式: 按时间间隔刷新
    flush_mode interval
    flush_interval 10s
    # 缓冲区配置
    <buffer>
        @type file
        path /var/log/fluentd/buffer/access
        flush_interval 10s
        chunk_limit_size 16MB
        total_limit_size 1GB
        overflow_action exception
    </buffer>
</match>

# ==================== 系统配置 ====================
<system>
    # Fluentd工作进程数（建议等于CPU核心数）
    workers 2
    # 日志级别: trace, debug, info, warn, error, fatal
    log_level info
</system>
